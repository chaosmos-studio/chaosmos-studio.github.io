<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="stitchfall-version" content="1">
<meta name="theme-color" content="#f1e1c8">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Stitchfall | Chaosmos</title>

<meta property="og:title" content="Stitchfall">
<meta property="og:description" content="Run, jump and turn gravity a quarter turn at a time through small rooms sewn from cloth, each with a trick to spot.">

<style>
@font-face{font-family:Threadline;src:url(Threadline-Woven.ttf) format('truetype')}
@font-face{font-family:DarnUI;src:url(Darn-UI.ttf) format('truetype')}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e1c8;color:#493a37;font:18px DarnUI,sans-serif;cursor:url(sewing_cursor.png) 5 5,auto}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:url(sewing_cursor.png) 5 5,auto}
#loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;box-sizing:border-box;padding:clamp(16px,4vw,52px);background:#ead9bf url(home_woodland.webp) center/cover no-repeat}
#loading:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f7eddaee 0%,#f7eddacb 47%,#f7edda36 100%)}
#loading>div{position:relative;width:min(1240px,100%);height:min(710px,90vh);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);align-items:center;gap:3vw}
#loading .load-copy{position:relative;padding:clamp(24px,4vw,56px);border:3px solid #9e7b5c;border-radius:36% 30% 27% 32% / 17% 19% 20% 19%;background:#f8eedce9;box-shadow:12px 17px 0 #6e594039}
#loading .load-copy:after{content:"";position:absolute;inset:12px;border:2px dashed #c09a76;border-radius:inherit;pointer-events:none}
#loading[hidden]{display:none}
h1{margin:0;line-height:0}
h1 img{display:block;width:min(100%,520px);height:auto;filter:drop-shadow(4px 7px 0 #6e594026)}
#status{min-height:1.4em;margin:22px 0 12px;font-size:clamp(17px,2vw,26px)}
.load-stage{position:relative;align-self:stretch;min-height:400px}
.load-stage:before{content:"";position:absolute;inset:10% 2%;border:8px solid #ae8d6b;border-radius:50%;background:#f3e2c8aa;box-shadow:inset 0 0 0 12px #f9ecd1,0 15px 30px #715a4240;transform:rotate(-12deg)}
.load-stage:after{content:"";position:absolute;inset:13% 5%;border:3px dashed #ae8d6b;border-radius:50%;transform:rotate(-12deg)}
.load-dancer{position:absolute;z-index:1;inset:0;display:grid;place-items:center;filter:drop-shadow(0 14px 7px #6d4b3260)}
.load-dancer img{position:absolute;max-height:100%;max-width:100%;height:100%;width:auto;object-fit:contain;opacity:0;animation:pose 6.4s steps(1,end) infinite}
.load-dancer img:nth-child(2){animation-delay:-4.8s}.load-dancer img:nth-child(3){animation-delay:-3.2s}.load-dancer img:nth-child(4){animation-delay:-1.6s}
@keyframes pose{0%,24.9%{opacity:1}25%,100%{opacity:0}}
.meter{height:20px;margin:22px 0 8px;overflow:hidden;border:3px solid #725243;border-radius:20px;background:#e7d3b7;text-align:left;box-shadow:inset 0 3px 4px #806b5b36}
.meter span{display:block;width:0;height:100%;border-radius:20px;background:repeating-linear-gradient(115deg,#ae6554 0 17px,#cc8570 18px 27px)}
#bytes{margin:7px 0 0;font-size:16px;font-variant-numeric:tabular-nums;color:#725243}
#error{max-width:28em;white-space:pre-wrap}
button{border:2px dashed #f7edda;border-radius:10px;background:#a85648;color:#f7edda;padding:12px 20px;font:18px Threadline,sans-serif;cursor:url(sewing_cursor.png) 5 5,pointer}
#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:32px;background:#f1e1c8;color:#493a37;text-align:center;font-size:22px;z-index:3}
@media (orientation:portrait){#rotate{display:flex}}
@media (max-width:700px){#loading>div{grid-template-columns:1fr;gap:0;height:auto}.load-stage{min-height:220px;order:-1}.load-dancer img{max-height:250px}#loading .load-copy{padding:20px 30px}}
@media (prefers-reduced-motion:reduce){.load-dancer img{animation:none}.load-dancer img:first-child{opacity:1}.meter span{transition:none}}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Stitchfall. Move with A and D or the arrow keys, jump with W or Space, crouch with S, and turn gravity with Shift or a click. On touchscreens, slide to move, swipe up to jump, swipe down to crouch, and tap to turn gravity. Open Guide for animated instructions.">Canvas is required to play Stitchfall.</canvas>
<div id="rotate">Turn your phone sideways to play Stitchfall.</div>
<div id="loading" role="status"><div><div class="load-copy"><h1><img src="logo_label.png" alt="Stitchfall" width="1000" height="214"></h1><p id="status">Threading the world...</p><div class="meter" id="meter"><span id="fill"></span></div><p id="bytes">Preparing the download...</p><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div><div class="load-stage" aria-hidden="true"><div class="load-dancer"><img src="loader_pose_0.webp" alt=""><img src="loader_pose_1.webp" alt=""><img src="loader_pose_2.webp" alt=""><img src="loader_pose_3.webp" alt=""></div></div></div></div>
<noscript>Enable JavaScript to play Stitchfall.</noscript>
<script>
window.stitchfallDownload = (received, total) => {
  if (!total) return;
  document.getElementById('fill').style.width = `${Math.min(100, received / total * 100).toFixed(1)}%`;
  document.getElementById('bytes').textContent = `${(received / 1000000).toFixed(1)} / ${(total / 1000000).toFixed(1)} MB`;
  document.getElementById('status').textContent = received < total ? 'Stitching the pieces together...' : 'Waking the world...';
};
</script>
<script src="wasm-loader.js?v=2cce204914df"></script>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":23358104,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading = document.getElementById('loading');
window.stitchfallToggleFullscreen = async () => {
  if (!document.fullscreenEnabled) return;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({navigationUI: 'hide'});
  } catch (error) { console.warn('Fullscreen unavailable', error); }
};
function fail(error) {
  document.getElementById('status').textContent = 'The game could not start.';
  document.getElementById('error').textContent = String(error);
  document.getElementById('meter').hidden = true;
  document.getElementById('retry').hidden = false;
}
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
  fail('This browser needs WebGL 2 and WebAssembly: ' + missing.join(', '));
} else {
  engine.startGame({canvas: document.getElementById('canvas')}).then(() => {
    loading.hidden = true;
    document.getElementById('canvas').focus();
  }).catch(fail);
}
</script>
</body>
</html>
