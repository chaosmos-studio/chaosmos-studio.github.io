<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="palewheel-version" content="2">
<meta name="theme-color" content="#f1e1c8">
<link rel="icon" href="data:,">
<title>Palewheel | Chaosmos</title>
<style>
@font-face{font-family:Threadline;src:url(Threadline-Satin.ttf) format('truetype');font-weight:400 700}
@font-face{font-family:Bricolage;src:url(BricolageGrotesque.ttf) format('truetype');font-weight:400}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f1e1c8;color:#493a37;font:16px Bricolage,sans-serif;cursor:url(sewing_cursor.png) 5 5,auto}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none;cursor:url(sewing_cursor.png) 5 5,auto}
#loading{position:fixed;inset:0;z-index:2;display:grid;place-items:center;box-sizing:border-box;padding:24px;background:repeating-linear-gradient(90deg,#ead9bf 0px,#ead9bf 3px,#eedec7 4px,#eedec7 7px);text-align:center}
#loading>div{position:relative;width:min(480px,86vw);padding:28px 34px 34px;box-sizing:border-box;border:3px solid #8d6b56;border-radius:24px;background:#f7edda;box-shadow:9px 12px 0 #8c725d45}
#loading>div:after{content:"";position:absolute;inset:10px;border:2px dashed #bc9a79;border-radius:15px;pointer-events:none}
#loading[hidden]{display:none}
h1{font:clamp(28px,7vw,42px) Threadline,sans-serif;letter-spacing:.02em;margin:0 0 8px;line-height:1.3}
.eyebrow{margin:0 0 6px;font-size:11px;font-weight:800;letter-spacing:.21em;color:#9b5749}
#status{min-height:1.4em;margin:16px 0 6px;font-weight:750}
.loom{height:105px;position:relative;margin:10px auto 0;width:180px}
.loom .thread{position:absolute;left:16px;top:69px;width:148px;height:6px;border-radius:100%;background:#a85648;box-shadow:0 7px 0 #d6ad87;transform:rotate(-5deg)}
.loom .spool{position:absolute;left:18px;top:35px;width:59px;height:51px;background:repeating-linear-gradient(0deg,#bd7761 0 6px,#a85648 7px 11px);border:5px solid #5b4038;border-radius:13px;animation:spool .75s steps(4) infinite}
.loom .spool:before,.loom .spool:after{content:"";position:absolute;left:-10px;width:69px;height:13px;background:#ecbf91;border:4px solid #5b4038;border-radius:12px}
.loom .spool:before{top:-13px}.loom .spool:after{bottom:-13px}
.loom .runner{position:absolute;left:102px;top:20px;width:48px;height:48px;background:#e9ab78;border:4px solid #493a37;border-radius:42% 47% 42% 42%;animation:step .65s steps(2) infinite}
.loom .runner:before{content:"";position:absolute;left:9px;top:17px;width:7px;height:8px;border-radius:50%;background:#493a37;box-shadow:20px 0 #493a37}
.loom .runner:after{content:"";position:absolute;left:-3px;top:-13px;width:15px;height:23px;border:4px solid #493a37;border-bottom:0;border-radius:60% 60% 0 0;background:#e9ab78;box-shadow:36px 1px 0 -1px #e9ab78,36px 0 0 2px #493a37}
.loom .feet{position:absolute;left:106px;top:73px;width:18px;height:21px;border-bottom:6px solid #493a37;transform:rotate(24deg);animation:feet .32s steps(2) infinite;box-shadow:25px 0 0 -1px #e9ab78}
@keyframes spool{to{background-position:0 44px}}
@keyframes step{50%{transform:translateY(-9px) rotate(5deg)}}
@keyframes feet{50%{transform:rotate(-22deg)}}
.meter{height:16px;margin:18px 0 5px;overflow:hidden;border:3px solid #725243;border-radius:20px;background:#e7d3b7;text-align:left}
.meter span{display:block;width:0;height:100%;border-radius:20px;background:repeating-linear-gradient(115deg,#ae6554 0 17px,#cc8570 18px 27px)}
#bytes{margin:7px 0 0;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;color:#725243}
#error{max-width:28em;white-space:pre-wrap}
button{border:2px dashed #f7edda;border-radius:10px;background:#a85648;color:#f7edda;padding:12px 20px;font:16px Threadline,sans-serif;cursor:url(sewing_cursor.png) 5 5,pointer}
#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:32px;background:#f1e1c8;color:#493a37;text-align:center;font-size:22px;z-index:3}
@media (orientation:portrait){#rotate{display:flex}}
@media (prefers-reduced-motion:reduce){.loom *{animation:none!important}.meter span{transition:none}}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Palewheel. Move with A and D or the arrow keys, jump with W or Space, crouch with S, and turn gravity with Shift or a click. On touchscreens, slide to move, swipe up to jump, swipe down to crouch, and tap to turn gravity.">Canvas is required to play Palewheel.</canvas>
<div id="rotate">Turn your phone sideways to play Palewheel.</div>
<div id="loading" role="status"><div><p class="eyebrow">A LITTLE THREAD, A BIG WORLD</p><h1>PALEWHEEL</h1><div class="loom" aria-hidden="true"><span class="thread"></span><span class="spool"></span><span class="runner"></span><span class="feet"></span></div><p id="status">Threading the world...</p><div class="meter" id="meter"><span id="fill"></span></div><p id="bytes">Preparing the download...</p><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Enable JavaScript to play Palewheel.</noscript>
<script>
window.palewheelDownload = (received, total) => {
  if (!total) return;
  document.getElementById('fill').style.width = `${Math.min(100, received / total * 100).toFixed(1)}%`;
  document.getElementById('bytes').textContent = `${(received / 1000000).toFixed(1)} / ${(total / 1000000).toFixed(1)} MB`;
  document.getElementById('status').textContent = received < total ? 'Stitching the pieces together...' : 'Waking the world...';
};
</script>
<script src="wasm-loader.js?v=3ececd942663"></script>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":29947944,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading = document.getElementById('loading');
window.palewheelToggleFullscreen = async () => {
  if (!document.fullscreenEnabled) return;
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen({navigationUI: 'hide'});
  } catch (error) { console.warn('Fullscreen unavailable', error); }
};
function fail(error) {
  document.getElementById('status').textContent = 'The game could not start.';
  document.getElementById('error').textContent = String(error);
  document.getElementById('meter').hidden = true;
  document.getElementById('retry').hidden = false;
}
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
  fail('This browser needs WebGL 2 and WebAssembly: ' + missing.join(', '));
} else {
  engine.startGame({canvas: document.getElementById('canvas')}).then(() => {
    loading.hidden = true;
    document.getElementById('canvas').focus();
  }).catch(fail);
}
</script>
</body>
</html>
