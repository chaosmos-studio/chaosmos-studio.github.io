<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#0f1330">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Apsis">
		<meta name="description" content="Tap an arrow and it flies out of the system, if its path is clear. Launch every arrow out.">
		<meta name="robots" content="noindex">
		<!-- The studio's two cookie-free visit counters, as on chaosmos.studio. -->
		<script async data-goatcounter="https://chaosmos.goatcounter.com/count" src="https://gc.zgo.at/count.js"></script>
		<script defer src="https://cloud.umami.is/script.js" data-website-id="284549b9-2ef0-4485-ae9d-2e2e85f7e0ac" data-domains="chaosmos.studio"></script>
		<link rel="icon" href="favicon.ico" sizes="any">
		<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
		<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon-180.png">
		<title>Apsis</title>
		<style>
/* Loading screen. The Godot boilerplate below is a known-good 4.7 shell with one change: it starts the
   engine once the gate (gate.js) lets it, which it does everywhere but on Android. The presentation is ours: the game's night, its
   wordmark, and a little sun whose arrow keeps flying out. */
@font-face {
	font-family: 'Outfit';
	src: url('Outfit-Light.ttf') format('truetype');
	font-weight: 300;
	font-display: block;
}
:root { --night: #0f1330; --night-top: #121842; --night-bottom: #0a0d22; --ink: #e9ecff; --muted: #8a93c4;
	--sun: #ffc56e; --sun-core: #fff3d1; --sun-rim: #ff9a4a; --accent: #ffb35c; --mint: #9be7c4; --panel: #1d2458; }
* { box-sizing: border-box; }
html, body {
	margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--night);
	font-family: 'Outfit', system-ui, sans-serif; -webkit-tap-highlight-color: transparent;
}
#canvas { display: block; width: 100%; height: 100%; border: 0; }
#canvas:focus { outline: none; }
#status {
	position: fixed; inset: 0; z-index: 10; visibility: visible;
	background: linear-gradient(var(--night-top), var(--night-bottom));
	display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
}
#brand h1 { margin: 0; font-size: clamp(72px, 24vw, 150px); font-weight: 300; color: var(--ink); line-height: 1; white-space: nowrap; }
#brand h1 span { color: var(--accent); }
#brand p { margin: 4px 0 0; text-align: center; font-size: clamp(16px, 4.4vw, 22px); color: var(--muted); }
#toy { position: relative; width: 200px; height: 200px; }
#ring {
	position: absolute; inset: 30px; border-radius: 50%; border: 2px solid rgba(199, 209, 255, .16);
}
#sun {
	position: absolute; left: 76px; top: 76px; width: 48px; height: 48px; border-radius: 50%;
	background: radial-gradient(circle at 42% 40%, var(--sun-core) 0 18%, var(--sun) 55%, var(--sun-rim) 100%);
	box-shadow: 0 0 34px 12px rgba(255, 154, 74, .28);
	animation: breathe 3s ease-in-out infinite;
}
#arrow {
	position: absolute; left: 100px; top: 100px; width: 44px; height: 16px; margin: -8px 0 0 -22px;
	border-radius: 8px; background: var(--mint); box-shadow: 0 0 16px rgba(155, 231, 196, .35);
	animation: fly 2.4s linear infinite;
}
#arrow::before {
	content: ''; position: absolute; left: 6px; right: 12px; top: 7px; height: 2px; border-radius: 1px;
	background: var(--night-bottom);
}
#arrow::after {
	content: ''; position: absolute; right: 4px; top: 3px; border-left: 9px solid var(--night-bottom);
	border-top: 5px solid transparent; border-bottom: 5px solid transparent;
}
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
@keyframes fly {
	0% { transform: rotate(-40deg) translateX(70px) scale(.3); opacity: 0; }
	12% { transform: rotate(-40deg) translateX(70px) scale(1); opacity: 1; }
	50% { transform: rotate(-40deg) translateX(70px); opacity: 1; animation-timing-function: cubic-bezier(.55, 0, .9, .5); }
	80% { opacity: 1; }
	100% { transform: rotate(-40deg) translateX(210px); opacity: 0; }
}
#status-progress {
	appearance: none; -webkit-appearance: none; border: 0;
	width: min(300px, 76vw); height: 14px; border-radius: 99px; display: block;
}
#status-progress::-webkit-progress-bar { background: var(--panel); border-radius: 99px; }
#status-progress::-webkit-progress-value { background: var(--accent); border-radius: 99px; }
#status-progress::-moz-progress-bar { background: var(--accent); border-radius: 99px; }
#status-notice {
	display: none; max-width: 86vw; padding: 16px 20px; border-radius: 18px; background: var(--panel);
	color: var(--ink); white-space: pre-line; text-align: center; box-shadow: 0 10px 24px rgba(0,0,0,.3);
}
@media (prefers-reduced-motion: reduce) { #sun, #arrow { animation: none; } }
		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>
		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
			<div id="brand">
				<h1>aps<span>is</span></h1>
				<p>launch every arrow out</p>
			</div>
			<div id="toy"><div id="ring"></div><div id="sun"></div><div id="arrow"></div></div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="gate.js" data-game="Apsis"></script>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1929016,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		(window.chaosmosGate || Promise.resolve()).then(() => {
			setStatusMode('progress');
			engine.startGame({
				'onProgress': function (current, total) {
					if (current > 0 && total > 0) {
						statusProgress.value = current;
						statusProgress.max = total;
					} else {
						statusProgress.removeAttribute('value');
						statusProgress.removeAttribute('max');
					}
				},
			}).then(() => {
				setStatusMode('hidden');
			}, displayFailureNotice);
		});
	}
}());
		</script>
	</body>
</html>
