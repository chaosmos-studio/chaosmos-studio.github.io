<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#f2ebdb"><meta name="description" content="Open Japanese puzzle boxes, one sliding panel at a time. A puzzle in development at Chaosmos."><title>Hako</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#f2ebdb,#d9c9b0);color:#331f14;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#f2ebdb,#d9c9b0);z-index:10;transition:opacity .35s}#loading.done{opacity:0;pointer-events:none}.card{max-width:380px;padding:32px;text-align:center}.logo{width:128px;height:128px;filter:drop-shadow(0 12px 24px rgba(59,42,34,.22))}h1{font-size:30px;font-weight:650;margin:22px 0 6px}p{line-height:1.5;color:#664a33;margin:0 0 18px}progress{width:200px;height:4px;accent-color:#b86f3a}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#331f14;color:#f2ebdb;border-radius:12px;padding:12px 24px;font:inherit;cursor:pointer}</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head><body>
<canvas id="canvas" tabindex="0" aria-label="Hako">Your browser needs canvas support.</canvas>
<!-- The logo is web/logo.svg, inlined so it shows before anything else loads. -->
<div id="loading" role="status"><div class="card"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="hk-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4ecdc"/>
      <stop offset="1" stop-color="#dccdb2"/>
    </linearGradient>
    <pattern id="hk-zig" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#ede0c4"/>
      <path d="M0 40 L20 0 L40 40 Z" fill="#9a4a33"/>
    </pattern>
    <pattern id="hk-dia" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#3b2a22"/>
      <path d="M20 4 L36 20 L20 36 L4 20 Z" fill="#b86f3a"/>
      <path d="M20 13 L27 20 L20 27 L13 20 Z" fill="#ede0c4"/>
    </pattern>
    <linearGradient id="hk-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ecc95c"/>
      <stop offset="1" stop-color="#c99b2e"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#hk-bg)"/>
  <ellipse cx="256" cy="420" rx="170" ry="22" fill="#3b2a22" fill-opacity="0.18"/>
  <rect x="96" y="96" width="320" height="320" rx="30" fill="#6e4a30"/>
  <rect x="120" y="120" width="272" height="272" rx="10" fill="#3b2a22"/>
  <rect x="120" y="120" width="272" height="80" fill="url(#hk-zig)"/>
  <rect x="120" y="208" width="272" height="80" fill="url(#hk-dia)"/>
  <rect x="120" y="296" width="190" height="96" fill="url(#hk-gold)"/>
  <rect x="310" y="296" width="82" height="96" fill="#1f1510"/>
  <rect x="310" y="296" width="10" height="96" fill="#f6d77a" fill-opacity="0.75"/>
  <path d="M244 328 L262 344 L244 360" fill="none" stroke="#6e4a30" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="176" cy="344" r="14" fill="#6e4a30" fill-opacity="0.35"/>
</svg><h1>Hako</h1><p id="status">Waxing the panels.</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Hako needs JavaScript enabled.</noscript>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":230584,"index.wasm":17150230},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
function fail(error){document.getElementById('status').textContent='Hako could not start.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly.';document.getElementById('retry').hidden=false;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(missing.join(', '))}else{engine.startGame({canvas,onProgress:(n,total)=>{if(total)document.getElementById('progress').value=n/total}}).then(()=>{document.getElementById('loading').classList.add('done');canvas.focus()}).catch(fail)}
</script></body></html>
