<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="rivet-campaign" content="3">
<meta name="theme-color" content="#f3f0e6">
<meta name="description" content="Rivet: a quiet puzzle of layers, colour, and careful choices. Play 36 verified solvable studies.">
<title>Rivet — a small sorting workshop</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f0e6;color:#283f3b;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f3f0e6;z-index:10}.card{max-width:380px;padding:32px;text-align:center}.mark{width:70px;height:70px;margin:0 auto 24px;border-radius:22px;background:#d97b5c;display:grid;place-items:center;color:#713d31;font-size:45px;font-weight:500;box-shadow:0 6px 0 #ba624a}h1{font-size:36px;letter-spacing:.22em;margin:16px 0}p{line-height:1.6;color:#697b70}progress{width:220px;height:5px;border:0;border-radius:8px;accent-color:#559f92}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#283f3b;color:#f3f0e6;border-radius:10px;padding:12px 24px;font:inherit;cursor:pointer}noscript{position:fixed;inset:0;padding:20vh 10vw;text-align:center;background:#f3f0e6}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<div id="game-state" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<canvas id="canvas" tabindex="0" aria-label="Rivet puzzle. Use arrows to choose a screw and Enter to collect. U: undo, H: hint, R: restart, M: sound. Number keys 1–7 return tray screws.">Your browser needs canvas support.</canvas>
<div id="loading" role="status" aria-live="polite"><div class="card"><div class="mark" aria-hidden="true">×</div><h1>RIVET</h1><p id="status">Opening the workshop…</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<a href="../../" style="position:fixed;right:12px;bottom:8px;color:#697b70;font:12px system-ui;z-index:3">More from Chaosmos</a>
<noscript>Rivet needs JavaScript enabled to run the Godot game.</noscript>
<script src="wasm-loader.js"></script>
<script src="index.js"></script>
<script>
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":103600,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine=new Engine(config);
const loading=document.getElementById('loading');
function fail(error){document.getElementById('status').textContent='The workshop could not open.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly support.';document.getElementById('retry').hidden=false;document.getElementById('progress').hidden=true;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail('Missing browser features: '+missing.join(', '));}else{
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total>0)document.getElementById('progress').value=current/total;}}).then(()=>{loading.style.display='none';document.getElementById('canvas').focus();}).catch(fail);
}
</script>
</body>
</html>
