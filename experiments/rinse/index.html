<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#b9e2ee"><meta name="description" content="A cleaning puzzle where the dirty water runs downhill. In development at Chaosmos."><title>Rinse</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#b9e2ee,#f5efe3);color:#1c4b57;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#b9e2ee,#f5efe3);z-index:10;transition:opacity .35s}#loading.done{opacity:0;pointer-events:none}.card{max-width:380px;padding:32px;text-align:center}.logo{width:128px;height:128px;filter:drop-shadow(0 12px 24px rgba(28,75,87,.2))}h1{font-size:30px;font-weight:650;margin:22px 0 6px}p{line-height:1.5;color:#3f7280;margin:0 0 18px}progress{width:200px;height:4px;accent-color:#1f7fb5}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#1c4b57;color:#f5efe3;border-radius:12px;padding:12px 24px;font:inherit;cursor:pointer}</style>

</head><body>

</svg><h1>Rinse</h1><p id="status">Filling the tank.</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Rinse needs JavaScript enabled.</noscript>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":264176,"index.wasm":17150230},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
function fail(error){document.getElementById('status').textContent='Rinse could not start.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly.';document.getElementById('retry').hidden=false;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(missing.join(', '))}else{engine.startGame({canvas,onProgress:(n,total)=>{if(total)document.getElementById('progress').value=n/total}}).then(()=>{document.getElementById('loading').classList.add('done');canvas.focus()}).catch(fail)}
</script></body></html>
