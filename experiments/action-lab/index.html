<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#263d30">
<title>Chaosmos Action Lab</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#263d30;color:#fff3d6;font:18px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at center,#4b6a50,#263d30);text-align:center;padding:24px}
#loading[hidden]{display:none}
h1{font-size:clamp(34px,8vw,72px);letter-spacing:.07em;margin:0 0 12px;color:#f4c36f}
p{margin:12px 0 22px}
progress{width:min(330px,82vw);height:12px;accent-color:#efbd64}
#error{max-width:30em;white-space:pre-wrap}
button{border:2px solid #efbd64;border-radius:12px;background:#efbd64;color:#263d30;padding:10px 18px;font:inherit}
#rotate{display:none;position:fixed;inset:0;place-items:center;background:#263d30;text-align:center;padding:24px;z-index:3}
@media(orientation:portrait){#rotate{display:grid}}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Chaosmos action game">A browser with WebGL 2 is needed to play.</canvas>
<div id="rotate">Turn your phone sideways to play.</div>
<div id="loading" role="status"><div><h1 id="game-title">ACTION LAB</h1><p id="status">Preparing the world...</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const loading=document.getElementById('loading');
const modes={brassburrow:'Brassburrow',veilmarket:'Veilmarket',threadrail:'Threadrail'};
const mode=new URLSearchParams(location.search).get('game')||'brassburrow';
const name=modes[mode]||modes.brassburrow;
document.title=name+' | Chaosmos experiments';
document.getElementById('game-title').textContent=name.toUpperCase();
canvas.setAttribute('aria-label',name+' action game');
document.getElementById('rotate').textContent='Turn your phone sideways to play '+name+'.';
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":1532484,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
function fail(error){document.getElementById('status').textContent='The burrow could not open.';document.getElementById('error').textContent=String(error);document.getElementById('progress').hidden=true;document.getElementById('retry').hidden=false}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail('This browser needs WebGL 2 and WebAssembly: '+missing.join(', '))}
else{engine.startGame({canvas,onProgress:(current,total)=>{if(total>0)document.getElementById('progress').value=current/total}}).then(()=>{loading.hidden=true;canvas.focus()}).catch(fail)}
</script>
</body>
</html>
