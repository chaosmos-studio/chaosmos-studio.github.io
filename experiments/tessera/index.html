<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="tessera-version" content="1">
<meta name="theme-color" content="#101725">
<meta name="description" content="Tessera: a finite block puzzle. Place pieces, clear rows and columns, and solve 18 boards.">
<title>Tessera — make room, make a line</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101725;color:#f3efdf;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#101725;z-index:10}.card{max-width:380px;padding:32px;text-align:center}h1{font-size:36px;letter-spacing:.22em;margin:16px 0}p{line-height:1.6;color:#8c9aae}progress{width:220px;height:5px;border:0;border-radius:8px;accent-color:#8ce5c5}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#f3efdf;color:#101725;border-radius:10px;padding:12px 24px;font:inherit;cursor:pointer}noscript{position:fixed;inset:0;padding:20vh 10vw;text-align:center;background:#101725}
.mark{display:grid;grid-template-columns:repeat(2,26px);gap:5px;width:57px;margin:0 auto 24px}.mark i{height:26px;background:#8ce5c5;border-radius:6px}.mark i:last-child{background:#eea579}#archive-link{position:fixed;right:16px;bottom:9px;color:#8c9aae;font-size:12px;text-decoration:none;z-index:3}#archive-link:hover{color:#8ce5c5}button{background:#8ce5c5;color:#101725}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head>
<body>
<div id="game-state" role="status" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<canvas id="canvas" tabindex="0" aria-label="Tessera block puzzle. Choose pieces with keys 1 to 3, move with arrows, and place with Enter. U undo, H hint, R restart.">Your browser needs canvas support.</canvas>
<div id="loading" role="status" aria-live="polite"><div class="card"><div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div><h1>TESSERA</h1><p id="status">Setting the pieces…</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<a id="archive-link" href="../../">More from Chaosmos</a>
<noscript>Tessera needs JavaScript enabled to run the Godot game.</noscript>
<script src="wasm-loader.js"></script>
<script src="index.js"></script>
<script>
const config={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":31804,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const engine=new Engine(config);
const loading=document.getElementById('loading');
function fail(error){document.getElementById('status').textContent='The board could not open.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly support.';document.getElementById('retry').hidden=false;document.getElementById('progress').hidden=true;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail('Missing browser features: '+missing.join(', '));}else{
engine.startGame({canvas:document.getElementById('canvas'),onProgress:(current,total)=>{if(total>0)document.getElementById('progress').value=current/total;}}).then(()=>{loading.style.display='none';document.getElementById('canvas').focus();}).catch(fail);
}
</script>
</body>
</html>
