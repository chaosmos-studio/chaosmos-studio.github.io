<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#e9f8f4"><meta name="description" content="Read the rings on a still pond, then cast once. A puzzle in development at Chaosmos."><title>Ripple</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#e9f8f4,#c9ebe3);color:#1d4e4a;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#e9f8f4,#c9ebe3);z-index:10;transition:opacity .35s}#loading.done{opacity:0;pointer-events:none}.card{max-width:380px;padding:32px;text-align:center}.logo{width:128px;height:128px;filter:drop-shadow(0 12px 24px rgba(29,78,74,.18))}h1{font-size:30px;font-weight:650;margin:22px 0 6px}p{line-height:1.5;color:#3f6f6a;margin:0 0 18px}progress{width:200px;height:4px;accent-color:#2a8c86}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#1d4e4a;color:#e9f8f4;border-radius:12px;padding:12px 24px;font:inherit;cursor:pointer}</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head><body>
<canvas id="canvas" tabindex="0" aria-label="Ripple">Your browser needs canvas support.</canvas>
<!-- The logo is web/logo.svg, inlined so it shows before anything else loads. -->
<div id="loading" role="status"><div class="card"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="rp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f8f4"/>
      <stop offset="1" stop-color="#bfe7de"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#rp-bg)"/>
  <circle cx="200" cy="214" r="118" fill="#2a8c86" fill-opacity="0.08" stroke="#2a8c86" stroke-width="22"/>
  <circle cx="318" cy="306" r="104" fill="#ef7d5a" fill-opacity="0.08" stroke="#ef7d5a" stroke-width="22"/>
  <circle cx="200" cy="214" r="17" fill="#1d5e5a"/>
  <circle cx="318" cy="306" r="17" fill="#b9553a"/>
  <g transform="translate(321 203) rotate(-28)">
    <path d="M-44 0 C-26 -26 18 -28 36 0 C18 28 -26 26 -44 0 Z" fill="#f59a3d"/>
    <path d="M30 0 L62 -22 L56 0 L62 22 Z" fill="#f59a3d"/>
    <path d="M-20 -14 C-6 -22 12 -20 20 -10 C6 -8 -8 -8 -20 -14 Z" fill="#ffffff" fill-opacity="0.85"/>
    <circle cx="-28" cy="-5" r="5" fill="#1d3b38"/>
  </g>
</svg><h1>Ripple</h1><p id="status">Filling the pond.</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Ripple needs JavaScript enabled.</noscript>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":360520,"index.wasm":17150230},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
function fail(error){document.getElementById('status').textContent='Ripple could not start.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly.';document.getElementById('retry').hidden=false;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(missing.join(', '))}else{engine.startGame({canvas,onProgress:(n,total)=>{if(total)document.getElementById('progress').value=n/total}}).then(()=>{document.getElementById('loading').classList.add('done');canvas.focus()}).catch(fail)}
</script></body></html>
