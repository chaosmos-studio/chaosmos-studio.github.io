<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="compassfall-version" content="1">
<meta name="theme-color" content="#f8f4e9">
<link rel="icon" href="data:,">
<title>Compassfall | Chaosmos</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8f4e9;color:#194851;font:16px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f8f4e9;text-align:center;padding:24px}
#loading[hidden]{display:none}
h1{font-size:32px;letter-spacing:.12em;margin:0 0 20px}
progress{width:min(240px,80vw);height:8px;accent-color:#e1845c}
#error{max-width:28em;white-space:pre-wrap}
button{border:1px solid #194851;background:transparent;color:#194851;padding:12px 20px;font:inherit}
#rotate{display:none;position:fixed;inset:0;align-items:center;justify-content:center;padding:32px;background:#f8f4e9;color:#194851;text-align:center;font-size:22px;z-index:3}
@media (orientation:portrait){#rotate{display:flex}}
</style>

</head>
<body>
<canvas id="canvas" tabindex="0" aria-label="Compassfall. Run, jump and turn gravity to guide the pilot through the station.">Canvas is required to play Compassfall.</canvas>
<div id="rotate">Turn your phone sideways to play Compassfall.</div>
<div id="loading" role="status"><div><h1>COMPASSFALL</h1><p id="status">Opening the station...</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Enable JavaScript to play Compassfall.</noscript>
<script src="wasm-loader.js"></script>
<script src="index.js"></script>
<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":527612,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
const loading = document.getElementById('loading');
function fail(error) {
  document.getElementById('status').textContent = 'The station could not open.';
  document.getElementById('error').textContent = String(error);
  document.getElementById('progress').hidden = true;
  document.getElementById('retry').hidden = false;
}
const missing = Engine.getMissingFeatures({threads: false});
if (missing.length) {
  fail('This browser needs WebGL 2 and WebAssembly: ' + missing.join(', '));
} else {
  engine.startGame({canvas: document.getElementById('canvas'), onProgress: (current, total) => {
    if (total > 0) document.getElementById('progress').value = current / total;
  }}).then(() => { loading.hidden = true; document.getElementById('canvas').focus(); }).catch(fail);
}
</script>
</body>
</html>
