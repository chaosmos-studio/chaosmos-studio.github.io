<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex"><meta name="theme-color" content="#ffedd9"><meta name="description" content="You are a small star, and your planets do the fighting. A game in development at Chaosmos."><title>Corona</title>
<style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#ffedd9,#d4e6fc);color:#1f213d;font:16px system-ui,sans-serif}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}#loading{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#ffedd9,#d4e6fc);z-index:10;transition:opacity .35s}#loading.done{opacity:0;pointer-events:none}.card{max-width:380px;padding:32px;text-align:center}.logo{width:128px;height:128px;filter:drop-shadow(0 12px 24px rgba(240,106,26,.22))}h1{font-size:30px;font-weight:650;margin:22px 0 6px}p{line-height:1.5;color:#575c80;margin:0 0 18px}progress{width:200px;height:4px;accent-color:#f06a1a}#error{display:none;white-space:pre-wrap;font-size:14px}button{border:0;background:#1f213d;color:#ffedd9;border-radius:12px;padding:12px 24px;font:inherit;cursor:pointer}</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

</head><body>
<canvas id="canvas" tabindex="0" aria-label="Corona">Your browser needs canvas support.</canvas>
<!-- The logo is web/logo.svg, inlined so it shows before anything else loads. -->
<div id="loading" role="status"><div class="card"><svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="cr-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffeedb"/>
      <stop offset="1" stop-color="#d4e5fc"/>
    </linearGradient>
    <radialGradient id="cr-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff9a2e" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#fa5a1e" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fa5a1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cr-star" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fff6b0"/>
      <stop offset="0.5" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#f06a1a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#cr-bg)"/>
  <circle cx="256" cy="256" r="170" fill="url(#cr-glow)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#1f2240" stroke-opacity="0.18" stroke-width="6"/>
  <path d="M120 300 A150 150 0 0 1 112 230" fill="none" stroke="#e8483a" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  <path d="M392 212 A150 150 0 0 1 400 282" fill="none" stroke="#1fb39a" stroke-opacity="0.35" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="74" fill="url(#cr-star)"/>
  <circle cx="108" cy="220" r="26" fill="#e8483a"/>
  <circle cx="100" cy="212" r="8" fill="#ffffff" fill-opacity="0.6"/>
  <circle cx="404" cy="292" r="26" fill="#1fb39a"/>
  <circle cx="396" cy="284" r="8" fill="#ffffff" fill-opacity="0.6"/>
</svg><h1>Corona</h1><p id="status">Lighting the star.</p><progress id="progress" max="1" value="0"></progress><p id="error"></p><button id="retry" hidden onclick="location.reload()">Try again</button></div></div>
<noscript>Corona needs JavaScript enabled.</noscript>
<script src="index.js"></script>
<script>
const canvas=document.getElementById('canvas');
const engine=new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":377740,"index.wasm":17150230},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
function fail(error){document.getElementById('status').textContent='Corona could not start.';const el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+'\nUse a browser with WebGL 2 and WebAssembly.';document.getElementById('retry').hidden=false;}
const missing=Engine.getMissingFeatures({threads:false});
if(missing.length){fail(missing.join(', '))}else{engine.startGame({canvas,onProgress:(n,total)=>{if(total)document.getElementById('progress').value=n/total}}).then(()=>{document.getElementById('loading').classList.add('done');canvas.focus()}).catch(fail)}
</script></body></html>
